[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotspotter"
version = "0.1.0"
description = "Interaction-aware hot-spot prediction for protein-protein interfaces"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michelle Brown" }]
license = { text = "MIT" }
dependencies = [
    "biopython>=1.83",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "truststore>=0.9",
]

[project.optional-dependencies]
sasa = ["freesasa>=2.2"]          # optional native backend; Biopython fallback exists
dev = ["pytest>=8.0"]
# only needed to re-run the rejected approaches under experiments/
experiments = ["torch>=2.2", "torch-geometric>=2.5", "transformers>=4.40", "pdb2pqr>=3.6"]

[project.scripts]
hotspotter = "hotspotter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
